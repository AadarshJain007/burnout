<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>BURNOUT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐀</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <div id="cursor-tool"><div id="tool-icon"></div></div>

  <div id="intro-modal" class="overlay open">
    <div class="modal-card">
      <div class="rat-logo">
        <svg viewBox="0 0 64 64" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="32" cy="38" rx="18" ry="14" fill="#fffdf9"/>
          <circle cx="20" cy="22" r="9" fill="#fffdf9"/>
          <circle cx="44" cy="22" r="9" fill="#fffdf9"/>
          <circle cx="26" cy="36" r="2.5" fill="currentColor"/>
          <circle cx="38" cy="36" r="2.5" fill="currentColor"/>
          <path d="M32 41v3m-3-1h6M14 42c-8 3-10 12-2 15M50 42c8 3 10 12 2 15"/>
        </svg>
      </div>
      <h2>ENTER<br><span>BURNOUT</span></h2>
      <p class="tagline">
        Grades. Finals. Tuition. Deadlines.<br>
        Take a weapon and smash it all.
      </p>

      <div style="margin-top: 18px;">
        <button id="btn-start-game" class="cta-btn">START SMASHING</button>
      </div>

      <div class="creator-credit">Made by Aadarsh Jain</div>
    </div>
  </div>

  <div id="pause-modal" class="overlay">
    <div class="modal-card">
      <h2>GAME <span>PAUSED</span></h2>
      <div class="pause-actions">
        <button id="btn-resume" class="cta-btn btn-sm">RESUME</button>
        <button id="btn-pause-restart" class="icon-btn">Restart</button>
        <button id="btn-pause-menu" class="icon-btn">Menu</button>
      </div>
    </div>
  </div>

  <div id="gameover-modal" class="overlay">
    <div class="modal-card">
      <h2 id="go-title">GAME <span>OVER</span></h2>

      <div class="stats-box">
        <div>
          <span class="label">SCORE</span>
          <div id="go-score" class="val val-red">0</div>
        </div>
        <div>
          <span class="label">WAVE</span>
          <div id="go-wave" class="val val-yellow">1</div>
        </div>
        <div>
          <span class="label">SMASHED</span>
          <div id="go-smashed" class="val">0</div>
        </div>
        <div>
          <span class="label">MAX COMBO</span>
          <div id="go-combo" class="val val-blue">x1</div>
        </div>
      </div>

      <div class="modal-nav-row" style="margin-top: 14px;">
        <button id="btn-restart" class="cta-btn btn-sm">PLAY AGAIN</button>
        <button id="btn-go-menu" class="icon-btn">Menu</button>
      </div>

      <div class="creator-credit">Made by Aadarsh Jain</div>
    </div>
  </div>

  <header>
    <div class="logo-area">
      <h1 class="logo-title">BURN<span>OUT</span></h1>
    </div>

    <div class="hud-group">
      <div class="pill">Points: <b id="hud-pts">0</b></div>
      <div id="hud-wave-pill" class="pill">Wave: <b id="hud-wave">1</b></div>

      <div class="rage-wrap" title="Hyper Rage Meter">
        <div class="rage-meter">
          <i id="rage-fill" class="rage-fill"></i>
          <span class="rage-text">RAGE</span>
        </div>
      </div>

      <button id="btn-audio-mute" class="icon-btn" title="Toggle Sound">🔊</button>
      <button id="btn-pause" class="icon-btn" title="Pause Game">⏸</button>
    </div>
  </header>

  <main id="arena">
    <div id="flash"></div>
    <div id="wave-announcer">
      <h3 id="wa-title">WAVE 1</h3>
      <p id="wa-desc">GET READY</p>
    </div>
  </main>

  <footer>
    <div class="weapon-bar">
      <button class="w-btn active" data-w="hammer">
        <span class="kbd">1</span>
        <svg class="w-icon" viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18l14-14m-12 10l-4 4 2 2 4-4m-2-12l4-4 8 8-4 4-8-8z"/></svg>
        <span>Hammer</span>
      </button>
      <button class="w-btn" data-w="bat">
        <span class="kbd">2</span>
        <svg class="w-icon" viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M26 6l-18 18-3-1 1-3 18-18 2 4z"/><path d="M6 25l-2 2 1 1 2-2"/></svg>
        <span>Bat</span>
      </button>
      <button class="w-btn" data-w="bomb">
        <span class="kbd">3</span>
        <svg class="w-icon" viewBox="0 0 32 32" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="18" r="9"/><path d="M20 11l3-3m-1 0c2-1 4 0 5-1"/><circle cx="28" cy="6" r="1.5" fill="#d97706" stroke="none"/></svg>
        <span>Bomb</span>
        <span id="hud-bombs" class="badge">3</span>
      </button>
    </div>
    <div class="footer-credit">Made by Aadarsh Jain</div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/state.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
